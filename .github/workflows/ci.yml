name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Android SDK（Platform 37）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # SDK 37 起平台采用 minor 版本命名（android-37.0）；两种包名都不可用时由 AGP 自动下载
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null 2>&1 || \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null 2>&1 || \
            echo "sdkmanager 无该平台包，交由 AGP 自动下载"

      - name: 单元测试与静态检查
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VidNest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
